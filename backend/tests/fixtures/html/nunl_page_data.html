{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","headline":"Watertoren van Waterdorp blijft staan","inLanguage":"nl-NL","articleBody":"Watertoren van Waterdorp blijft staan\nDe gemeente Waterdorp wil de oude watertoren aan de Havenkade laten staan. Een voorstel om het gebouw te slopen en er woningen te bouwen, kreeg donderdag geen meerderheid in de raad. Wethouder Anna de Wit waarschuwt dat het opknappen van de toren de gemeente de komende jaren veel geld gaat kosten.\nDe toren staat al twaalf jaar leeg en heeft volgens de gemeente achterstallig onderhoud. Het dak lekt en een deel van het metselwerk moet worden vervangen voordat het gebouw weer gebruikt kan worden.\nEen projectontwikkelaar bood eerder aan om op de plek veertig appartementen te bouwen. Maar een meerderheid van de raad steunde het voorstel van de lokale partij om de toren te behouden. De voorstanders willen voorkomen dat het laatste oude gebouw van de haven verdwijnt.\nDe meerderheid kwam tot stand nadat twee coalitiepartijen vorige week afspraken maakten met de oppositie. Die steunde de begroting in ruil voor het behoud van de watertoren en een onderzoek naar een nieuwe bestemming.\nWethouder De Wit is tegen het besluit. Ze vreest dat de kosten hoger uitvallen dan nu wordt gedacht, omdat de fundering nog niet is onderzocht. Bovendien loopt de gemeente volgens haar de opbrengst van de grond mis, ruim drie miljoen euro."}]}
